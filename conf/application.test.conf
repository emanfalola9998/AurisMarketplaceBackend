include "application.conf"

# The full schema uses Postgres-only features (enum types, JSONB, pg_trgm/GIN
# indexes, pgcrypto), none of which H2 can run even in PostgreSQL-compat mode.
#
# Integration tests point at "auris_test", a genuinely separate database
# from auris_dev — not a schema, not a search_path trick. Two earlier
# versions of this file tried to isolate via a schema instead (JDBC
# `currentSchema` URL param, then `connectionInitSql`) and both silently
# failed to actually scope connections away from public, which meant the
# test suite's TRUNCATE ran against real auris_dev seed data. A separate
# database has no search_path ambiguity to get wrong: every table
# unqualified-referenced by the app or by PlayIntegrationSpec's cleanup can
# only ever resolve inside auris_test.
slick.dbs.default.profile   = "co.auris.db.AurisPostgresProfile$"
slick.dbs.default.db.driver = "org.postgresql.Driver"
slick.dbs.default.db.url    = "jdbc:postgresql://localhost:5432/auris_test"
slick.dbs.default.db.user   = "auris"
# Set explicitly here rather than relying on inheritance through
# application.dev.conf's include — that file's password is meant to track
# whatever application.conf's db.default.url points at (Neon in prod-like
# dev use), which is a different credential than this local auris_test
# database's, so leaving this to inherit was fragile.
slick.dbs.default.db.password = "auris_dev_local"

play.evolutions.db.default.autoApply = true

play.mailer.mock = true

auris.jwt.secret = "test-jwt-secret-key-at-least-32-chars-long"

# Every FakeRequest in the test suite shares the same "127.0.0.1" remote
# address, so a real limit would trip across unrelated specs sharing a
# GuiceOneAppPerSuite app. Specs that want to exercise rate limiting itself
# override this back on via a custom fakeApplication() (see AuthRateLimitSpec).
auris.rateLimit.enabled = false
