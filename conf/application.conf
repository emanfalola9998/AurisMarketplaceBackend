# ─── conf/application.conf ───────────────────────────────────────────────────
#
# Auris — Play Framework configuration
#
# Sensitive values (marked REPLACE_ME) should come from environment variables
# in production. Use something like:
#
#   slick.dbs.default.db.url = ${?DATABASE_URL}
#   auris.jwt.secret         = ${?JWT_SECRET}
#
# Local dev: override in conf/application.dev.conf (gitignored)
# Tests:     override in conf/application.test.conf

# ─── Play ─────────────────────────────────────────────────────────────────────

play.http.secret.key = "REPLACE_ME_LONG_RANDOM_STRING_MIN_32_CHARS"
play.http.secret.key = ${?PLAY_SECRET_KEY}

play.i18n.langs = ["en"]

# ─── Startup checks ───────────────────────────────────────────────────────────
# Fails fast in production if secrets are still the committed placeholders —
# see ConfigValidator for what's checked.

play.modules.enabled += "co.auris.startup.StartupModule"

# ─── Allowed hosts ────────────────────────────────────────────────────────────

play.filters.hosts {
  allowed = ["localhost", "localhost:9000", "auris.co", ".auris.co"]
  allowed = ${?ALLOWED_HOSTS}
}

# ─── CORS ─────────────────────────────────────────────────────────────────────

play.filters.enabled += "play.filters.cors.CORSFilter"

play.filters.cors {
  # Vite dev server
  allowedOrigins     = ["http://localhost:5173", "https://auris.co"]
  allowedOrigins     = ${?ALLOWED_ORIGINS}
  allowedHttpMethods = ["GET", "POST", "PUT", "PATCH", "DELETE", "OPTIONS"]
  allowedHttpHeaders = ["Accept", "Content-Type", "Authorization", "X-Requested-With"]
  preflightMaxAge    = 3600 seconds
  supportsCredentials = true
}

# ─── CSRF ─────────────────────────────────────────────────────────────────────
# Disabled — we use stateless JWT, not sessions/cookies.
# Re-enable if you add any session-based endpoints.

play.filters.disabled += "play.filters.csrf.CSRFFilter"

# ─── HTTP ─────────────────────────────────────────────────────────────────────

play.http.errorHandler = "co.auris.filters.JsonErrorHandler"

play.filters.enabled += "co.auris.filters.RequestLoggingFilter"

# Maximum request body size (for file uploads — CV, photos)
play.http.parser.maxDiskBuffer  = 10MB
play.http.parser.maxMemoryBuffer = 256k

# ─── Database — Slick + PostgreSQL ────────────────────────────────────────────

slick.dbs.default {
  profile = "co.auris.db.AurisPostgresProfile$"
  db {
    driver    = "org.postgresql.Driver"
    url       = "jdbc:postgresql://localhost:5432/auris_dev"
    url       = ${?DATABASE_URL}
    user      = "auris"
    user      = ${?DATABASE_USER}
    password  = ""
    password  = ${?DATABASE_PASSWORD}

    # ── HikariCP connection pool ─────────────────────────────────────────
    connectionPool     = "HikariCP"
    numThreads         = 10
    maxConnections     = 20
    minConnections     = 5
    connectionTimeout  = 30000   # ms
    idleTimeout        = 600000  # ms (10 min)
    maxLifetime        = 1800000 # ms (30 min)
    keepAliveConnection = true
  }
}

# ─── Evolutions ───────────────────────────────────────────────────────────────

play.evolutions {
  db.default.enabled    = true
  db.default.autoApply  = true   # set false in production; run manually
  db.default.autoApply  = ${?EVOLUTIONS_AUTO_APPLY}
  db.default.autoApplyDowns = false
}

# ─── JWT ──────────────────────────────────────────────────────────────────────

auris.jwt {
  secret            = "REPLACE_ME_JWT_SECRET_MIN_64_CHARS_RANDOM"
  secret            = ${?JWT_SECRET}
  algorithm         = "HS256"
  accessTokenTtl    = 900       # seconds (15 min)
  refreshTokenTtl   = 604800    # seconds (7 days)
  issuer            = "auris.co"
}

# ─── BCrypt ───────────────────────────────────────────────────────────────────

auris.bcrypt.rounds = 12

# ─── Rate limiting ────────────────────────────────────────────────────────────
# In-memory per-IP limits on auth endpoints prone to brute-force/abuse. See
# RateLimiter/RateLimitAction. Disabled in tests (application.test.conf) so
# the shared FakeRequest IP doesn't trip limits across unrelated specs.

auris.rateLimit {
  enabled = true
  enabled = ${?RATE_LIMIT_ENABLED}

  signIn.maxAttempts           = 10
  signIn.windowMinutes         = 15

  signUp.maxAttempts           = 5
  signUp.windowMinutes         = 60

  forgotPassword.maxAttempts   = 5
  forgotPassword.windowMinutes = 60

  resetPassword.maxAttempts    = 10
  resetPassword.windowMinutes  = 15
}

# ─── Email — Play Mailer ──────────────────────────────────────────────────────

play.mailer {
  host     = "smtp.sendgrid.net"
  host     = ${?SMTP_HOST}
  port     = 587
  ssl      = false
  tls      = true
  user     = "apikey"
  user     = ${?SMTP_USER}
  password = ""
  password = ${?SMTP_PASSWORD}
  mock     = true   # set false in production to actually send
  mock     = ${?MAILER_MOCK}
}

auris.email {
  fromAddress = "noreply@auris.co"
  fromName    = "Auris"
  supportEmail = "support@auris.co"
}

# Base URL of the frontend, used to build links in transactional emails.
auris.frontendUrl = "http://localhost:5173"
auris.frontendUrl = ${?FRONTEND_URL}

# ─── File storage ─────────────────────────────────────────────────────────────
# Local for dev; swap for S3 in production

auris.storage {
  provider     = "local"            # "local" | "s3"
  localPath    = "/tmp/auris-uploads"
  s3Bucket     = ${?AWS_S3_BUCKET}
  s3Region     = "eu-west-2"
  maxFileSizeMb = 10
  allowedTypes  = ["image/jpeg", "image/png", "application/pdf"]
}

# ─── Stripe ───────────────────────────────────────────────────────────────────

stripe.secretKey     = "sk_test_REPLACE_ME"
stripe.secretKey     = ${?STRIPE_SECRET_KEY}
stripe.webhookSecret = "whsec_REPLACE_ME"
stripe.webhookSecret = ${?STRIPE_WEBHOOK_SECRET}

# ─── Surgeon billing ──────────────────────────────────────────────────────────
# Auris has no Stripe Connect accounts for surgeons — all patient payments
# land in Auris's own Stripe account. Surgeons are charged an annual
# membership fee directly (a Stripe subscription), and a 1% cut of every
# paid booking is recorded in the platform_fees ledger for manual payout
# reconciliation rather than deducted automatically.

auris.billing.annualMembershipFeeGbp = 2400
auris.billing.transactionFeeRate     = 0.01

# ─── Pagination defaults ──────────────────────────────────────────────────────

auris.pagination {
  defaultPageSize = 20
  maxPageSize     = 100
}

# ─── Feature flags ────────────────────────────────────────────────────────────

auris.features {
  virtualConsultations = true
  patientReviews       = true
  surgeonAnalytics     = true
  emailNotifications   = false   # flip to true once SMTP is configured
}

# ─── Akka ─────────────────────────────────────────────────────────────────────

akka {
  actor.default-dispatcher {
    fork-join-executor {
      parallelism-min    = 8
      parallelism-factor = 2.0
      parallelism-max    = 64
    }
  }
  # Separate dispatcher for blocking DB calls
  blocking-dispatcher {
    type       = Dispatcher
    executor   = "thread-pool-executor"
    thread-pool-executor {
      fixed-pool-size = 32
    }
    throughput = 1
  }
}

# ─── Local dev overrides ───────────────────────────────────────────────────────
# Loaded last so its values win. Silently skipped if the file doesn't exist
# (e.g. on a teammate's fresh clone, or in CI).

include "application.dev.conf"